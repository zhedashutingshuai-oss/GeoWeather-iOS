name: GeoWeather
options:
  bundleIdPrefix: com.zhedashutingshuai
  deploymentTarget:
    iOS: "26.0"
targets:
  GeoWeather:
    type: application
    platform: iOS
    sources:
      - GeoWeather
    info:
      path: GeoWeather/Info.plist
      properties:
        CFBundleDisplayName: 司天
        NSLocationWhenInUseUsageDescription: 用于显示你所在位置的天气
        NSPhotoLibraryAddUsageDescription: 用于把生成的天气壁纸保存到相册
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: GeoWeather/GeoWeather.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zhedashutingshuai.geoweather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhedashutingshuai.geoweather
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Generate App Icon
        script: |
          set -e
          cd "$SRCROOT"
          OUT="GeoWeather/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ ! -f "$OUT" ]; then
            base64 -D -i "GeoWeather/AppIcon/icon-1024.b64" -o "$OUT"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - target: GeoWeatherWidget
  GeoWeatherWidget:
    type: app-extension
    platform: iOS
    sources:
      - GeoWeatherWidget
      - path: GeoWeather/Models.swift
      - path: GeoWeather/WeatherService.swift
      - path: GeoWeather/WeatherCode.swift
      - path: GeoWeather/SharedSnapshot.swift
      - path: GeoWeather/IconData.swift
      - path: GeoWeather/IconData1.swift
      - path: GeoWeather/IconData2.swift
      - path: GeoWeather/IconData3.swift
    info:
      path: GeoWeatherWidget/Info.plist
      properties:
        CFBundleDisplayName: 司天
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GeoWeatherWidget/GeoWeatherWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zhedashutingshuai.geoweather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhedashutingshuai.geoweather.widget
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
