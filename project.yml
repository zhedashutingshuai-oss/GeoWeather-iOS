name: GeoWeather
options:
  bundleIdPrefix: com.zhedashutingshuai
  deploymentTarget:
    iOS: "26.0"
targets:
  GeoWeather:
    type: application
    platform: iOS
    sources:
      - GeoWeather
    info:
      path: GeoWeather/Info.plist
      properties:
        CFBundleDisplayName: 几何天气
        NSLocationWhenInUseUsageDescription: 用于显示你所在位置的天气
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhedashutingshuai.geoweather
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
