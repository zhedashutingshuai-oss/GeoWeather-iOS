name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project GeoWeather.xcodeproj \
            -scheme GeoWeather \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GeoWeather.app Payload/
          zip -qry GeoWeather.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoWeather-IPA
          path: GeoWeather.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" GeoWeather.ipa \
            --title "几何天气 iOS · build ${{ github.run_number }}" \
            --notes "未签名 IPA。下载后用 SideStore / AltStore 自签安装到 iPhone。"
